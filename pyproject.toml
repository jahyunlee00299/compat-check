[project]
name = "compat-check"
dynamic = ["version"]
description = "Check whether a GitHub repo or PyPI package would install cleanly in this environment, without actually installing it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "jahyunlee00299" }]
keywords = ["dependencies", "packaging", "pip", "uv", "dry-run", "resolver"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]

[project.urls]
Homepage = "https://github.com/jahyunlee00299/compat-check"
Repository = "https://github.com/jahyunlee00299/compat-check"
Issues = "https://github.com/jahyunlee00299/compat-check/issues"

[project.scripts]
compat-check = "compat_check.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["compat_check"]

[tool.setuptools.dynamic]
version = { attr = "compat_check.__version__" }
